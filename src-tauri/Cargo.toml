[package]
name = "itsm-manager"
version = "0.1.5"
description = "ITSM 工单管理工具"
edition = "2021"

[lib]
name = "itsm_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
base64 = "0.22"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["windows-native"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
